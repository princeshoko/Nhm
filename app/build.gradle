plugins {
    id 'com.android.application'
}

android {
    namespace 'net.nerdhalla.sharla'
    compileSdk 35

    defaultConfig {
        applicationId 'net.nerdhalla.sharla'
        minSdk 26
        targetSdk 35
        versionCode 284
        versionName '2.5.34'
    }

    signingConfigs {
        nerdhallaRelease {
            // The permanent PKCS#12 key is supplied from GitHub Actions secrets.
            // Never commit the keystore, certificate's private key, or passwords.
            storeFile file(System.getenv('NERDHALLA_KEYSTORE_FILE') ?: 'missing-release-keystore.p12')
            storePassword System.getenv('NERDHALLA_KEYSTORE_PASSWORD')
            keyAlias 'nerdhalla'
            keyPassword System.getenv('NERDHALLA_KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.nerdhallaRelease
        }
    }
}
