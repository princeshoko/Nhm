name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Add Nerdhalla launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          curl -L --fail --retry 3             "https://nerdhalla.net/bot-icon.php?server=854996860224262144&v=nh-android"             -o app/src/main/res/drawable/nerdhalla_icon.png
          file app/src/main/res/drawable/nerdhalla_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nerdhalla-Sharla-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
