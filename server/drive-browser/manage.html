<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0811">
<title>Nerdhalla Drive</title>
<style>
:root{--bg:#0b0811;--bg2:#120c1c;--panel:#171020;--panel2:#1e152a;--line:#352347;--text:#f5efff;--muted:#aaa0b7;--purple:#9b6cff;--purple2:#c6a8ff;--gold:#e4b95d;--green:#6fd7a8;--red:#e15f69}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 90% 0,rgba(155,108,255,.18),transparent 32rem),radial-gradient(circle at 10% 5%,rgba(228,185,93,.09),transparent 26rem),linear-gradient(180deg,var(--bg2),var(--bg));}
a{color:inherit}.topbar{position:sticky;top:0;z-index:20;background:rgba(11,8,17,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)}.topbar-inner{max-width:1180px;margin:auto;padding:12px 20px;display:flex;gap:18px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:950;letter-spacing:.05em}.brand-mark{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:#050406;font-size:19px}.rainbow{background:linear-gradient(90deg,#ff5f6d,#ff9f43,#ffd93d,#6bff95,#4dc9ff,#9b6cff,#ff6ec7);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;margin-top:2px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{text-decoration:none;color:#d8cfe3;font-size:13px;font-weight:750}.nav a:hover{color:#fff}.shell{max-width:1180px;margin:auto;padding:28px 20px 60px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}.hero h1{margin:0;font-size:clamp(32px,6vw,54px);letter-spacing:-.04em}.hero p{margin:8px 0 0;color:var(--muted);max-width:720px}.status-card,.toolbar,.files-card{border:1px solid var(--line);border-radius:18px;background:rgba(23,16,32,.93);box-shadow:0 18px 60px rgba(0,0,0,.22)}.status-card{padding:16px 18px;min-width:min(100%,320px)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.stat{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.stat b{display:block;font-size:14px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.toolbar{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.btn{appearance:none;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--panel2);color:var(--text);font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}.btn.primary{background:linear-gradient(90deg,#7a4df2,#a678ff);border-color:#a882ff}.btn.danger{background:#6d2b33;border-color:#9b4853}.btn:disabled{opacity:.45;cursor:not-allowed}.crumbs{display:flex;gap:5px;align-items:center;flex:1;min-width:220px;overflow:auto}.crumbs button{background:none;border:0;color:var(--purple2);font-weight:800;cursor:pointer;padding:6px}.dropzone{border:1px dashed #72529c;border-radius:14px;padding:14px;text-align:center;color:var(--muted);margin-bottom:14px;background:rgba(155,108,255,.05)}.dropzone.drag{border-color:#c9afff;background:rgba(155,108,255,.12);color:#fff}.progress-wrap{display:none;margin:0 0 14px}.progress{height:10px;background:#24182f;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#9b6cff,#6fd7a8)}.progress-text{font-size:12px;color:var(--muted);margin-top:6px}.files-card{overflow:hidden}.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 15px;border-top:1px solid rgba(255,255,255,.06)}.file-row:first-child{border-top:0}.file-main{display:flex;align-items:center;gap:11px;min-width:0}.file-icon{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line);flex:0 0 auto}.file-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions .btn{padding:7px 9px;font-size:12px}.empty{padding:34px;text-align:center;color:var(--muted)}.notice{margin:12px 0;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:none}.notice.error{display:block;color:#ffd2d7;border-color:#7a3942}.notice.ok{display:block;color:#d2ffe9;border-color:#376d58}.login-card{max-width:620px;margin:70px auto;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:center}.login-card h2{margin-top:0}.footer{max-width:1180px;margin:0 auto;padding:24px 20px 34px;color:var(--muted);font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
@media(max-width:720px){.topbar-inner{align-items:flex-start;flex-direction:column}.nav{gap:9px}.stats{grid-template-columns:1fr}.file-row{grid-template-columns:1fr}.actions{justify-content:flex-start}.shell{padding-left:12px;padding-right:12px}.toolbar{align-items:stretch}.toolbar>.btn{flex:1 1 auto}.crumbs{order:3;flex-basis:100%}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="https://nerdhalla.net/"><span class="brand-mark">NH</span><span><span class="rainbow">NERDHALLA</span><small>GAMES • BOTS • COMMUNITY</small></span></a><nav class="nav"><a href="https://nerdhalla.net/">Home</a><a href="https://nerdhalla.net/sharla.html">Sharla</a><a href="https://nerdhalla.net/booster.html">Boost</a><a href="https://nerdhalla.net/webmail.html">Webmail</a><a class="rainbow" href="https://discord.com/invite/3W6qbVgCHF">Join</a></nav></div></header>
<main class="shell" id="app"></main>
<footer class="footer"><strong class="rainbow">NERDHALLA</strong> Drive • Browser file manager • FTP and SFTP remain available.</footer>
<script>
(() => {
  const app = document.getElementById('app');
  const TOKEN_KEY = 'nerdhalla_drive_manage_token';
  let token = '';
  let currentPath = '';
  let session = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const human = n => {n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i===0?Math.round(n):n.toFixed(n>=100?0:n>=10?1:2))+' '+u[i]};
  const dateFmt = t => new Date(Number(t)*1000).toLocaleString();
  const joinPath = (a,b) => a ? a.replace(/\/$/,'')+'/'+b : b;
  const parentPath = p => p.includes('/') ? p.slice(0,p.lastIndexOf('/')) : '';

  function getToken(){
    const hash = new URLSearchParams(location.hash.replace(/^#/,''));
    const fromHash = hash.get('token');
    if(fromHash){
      sessionStorage.setItem(TOKEN_KEY, fromHash);
      history.replaceState(null,'',location.pathname + location.search);
    }
    return fromHash || sessionStorage.getItem(TOKEN_KEY) || '';
  }

  function loginScreen(message=''){
    sessionStorage.removeItem(TOKEN_KEY);
    app.innerHTML = `<section class="login-card"><h2><span class="rainbow">NERDHALLA</span> Drive</h2><p>${esc(message || 'Log in through Nerdhalla to manage your Drive in the browser.')}</p><p><a class="btn primary" href="https://nerdhalla.net/drive-manage.php">Login / Open My Drive</a></p><p style="color:var(--muted);font-size:12px">FTP and SFTP still work exactly as before.</p></section>`;
  }

  async function api(path, options={}){
    const headers = new Headers(options.headers || {});
    headers.set('Authorization','Bearer '+token);
    if(options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) headers.set('Content-Type','application/json');
    const r = await fetch('/api/'+path, {...options, headers, cache:'no-store'});
    let data = null;
    try{ data = await r.json(); }catch{ data = {ok:false,error:'Invalid server response'}; }
    if(r.status===401){ loginScreen('Your Drive login expired. Log in again.'); throw new Error('Login expired'); }
    if(!r.ok || data?.ok===false) throw new Error(data?.error || `HTTP ${r.status}`);
    return data;
  }

  function shell(){
    app.innerHTML = `<section class="hero"><div><h1><span class="rainbow">NERDHALLA</span> Drive</h1><p>Upload and manage your personal storage from the browser. FTP/FTPS and SFTP remain optional.</p></div><div class="status-card"><b id="username">Loading…</b><div class="stats"><div class="stat"><b id="total">—</b><span>Total</span></div><div class="stat"><b id="used">—</b><span>Used</span></div><div class="stat"><b id="free">—</b><span>Free</span></div></div></div></section><div class="toolbar"><button class="btn primary" id="uploadBtn">⬆ Upload Files</button><button class="btn" id="folderBtn">＋ New Folder</button><button class="btn" id="refreshBtn">↻ Refresh</button><div class="crumbs" id="crumbs"></div><input id="fileInput" type="file" multiple hidden></div><div class="dropzone" id="dropzone">Drop files here to upload to this folder</div><div class="progress-wrap" id="progressWrap"><div class="progress"><div id="progressBar"></div></div><div class="progress-text" id="progressText"></div></div><div id="notice" class="notice"></div><section class="files-card" id="files"><div class="empty">Loading…</div></section>`;
    document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = e => uploadFiles([...e.target.files]);
    document.getElementById('folderBtn').onclick = createFolder;
    document.getElementById('refreshBtn').onclick = () => loadList();
    const dz = document.getElementById('dropzone');
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
    dz.addEventListener('drop',e=>uploadFiles([...e.dataTransfer.files]));
  }

  function notice(msg,type='ok'){
    const n=document.getElementById('notice'); if(!n)return;
    n.className='notice '+type; n.textContent=msg;
    clearTimeout(notice.t); notice.t=setTimeout(()=>{n.className='notice'},5000);
  }

  function renderCrumbs(){
    const c=document.getElementById('crumbs');
    const parts=currentPath?currentPath.split('/'):[];
    let html='<button data-path="">My Drive</button>';
    let p='';
    for(const part of parts){ p=joinPath(p,part); html += `<span>/</span><button data-path="${esc(p)}">${esc(part)}</button>`; }
    c.innerHTML=html;
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{currentPath=b.dataset.path||'';loadList()});
  }

  async function loadList(){
    try{
      const data=await api('list?path='+encodeURIComponent(currentPath));
      renderCrumbs();
      document.getElementById('username').textContent='@'+data.username;
      document.getElementById('total').textContent=human(data.usage.total_bytes);
      document.getElementById('used').textContent=human(data.usage.used_bytes);
      document.getElementById('free').textContent=human(data.usage.free_bytes);
      const files=document.getElementById('files');
      let rows='';
      if(currentPath){ rows += `<div class="file-row"><div class="file-main"><div class="file-icon">↩</div><div><div class="file-name">..</div><div class="file-meta">Parent folder</div></div></div><div class="actions"><button class="btn" data-up="1">Open</button></div></div>`; }
      for(const item of data.items){
        const icon=item.type==='dir'?'📁':'📄';
        const meta=item.type==='dir'?'Folder':`${human(item.size)} • ${esc(dateFmt(item.mtime))}`;
        rows += `<div class="file-row"><div class="file-main"><div class="file-icon">${icon}</div><div style="min-width:0"><div class="file-name" title="${esc(item.name)}">${esc(item.name)}</div><div class="file-meta">${meta}</div></div></div><div class="actions">${item.type==='dir'?`<button class="btn" data-open="${esc(item.path)}">Open</button>`:`<button class="btn" data-download="${esc(item.path)}">Download</button>`}<button class="btn" data-rename="${esc(item.path)}" data-name="${esc(item.name)}">Rename</button><button class="btn danger" data-delete="${esc(item.path)}" data-name="${esc(item.name)}">Delete</button></div></div>`;
      }
      files.innerHTML = rows || '<div class="empty">This folder is empty. Drop files here or use Upload Files.</div>';
      files.querySelector('[data-up]')?.addEventListener('click',()=>{currentPath=parentPath(currentPath);loadList()});
      files.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{currentPath=b.dataset.open;loadList()});
      files.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.download));
      files.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameItem(b.dataset.rename,b.dataset.name));
      files.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete,b.dataset.name));
    }catch(e){ notice(e.message,'error'); }
  }

  async function uploadFiles(files){
    files=files.filter(Boolean); if(!files.length)return;
    const wrap=document.getElementById('progressWrap'), bar=document.getElementById('progressBar'), txt=document.getElementById('progressText');
    wrap.style.display='block';
    for(let i=0;i<files.length;i++){
      const file=files[i]; txt.textContent=`Uploading ${i+1} of ${files.length}: ${file.name}`; bar.style.width='0%';
      try{ await uploadOne(file,p=>bar.style.width=Math.min(100,p)+'%'); }
      catch(e){ notice(`${file.name}: ${e.message}`,'error'); wrap.style.display='none'; await loadList(); return; }
    }
    wrap.style.display='none'; notice(`${files.length} file${files.length===1?'':'s'} uploaded.`,'ok'); document.getElementById('fileInput').value=''; await loadList();
  }

  function uploadOne(file,onProgress){
    return new Promise((resolve,reject)=>{
      const form=new FormData(); form.append('file',file,file.name);
      const xhr=new XMLHttpRequest(); xhr.open('POST','/api/upload?path='+encodeURIComponent(currentPath)); xhr.setRequestHeader('Authorization','Bearer '+token);
      xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total*100)};
      xhr.onload=()=>{let d={};try{d=JSON.parse(xhr.responseText||'{}')}catch{};if(xhr.status>=200&&xhr.status<300&&d.ok!==false)resolve(d);else if(xhr.status===401){loginScreen('Your Drive login expired. Log in again.');reject(new Error('Login expired'))}else reject(new Error(d.error||`HTTP ${xhr.status}`))};
      xhr.onerror=()=>reject(new Error('Network upload failed'));
      xhr.send(form);
    });
  }

  async function createFolder(){
    const name=prompt('New folder name:'); if(!name)return;
    try{await api('mkdir',{method:'POST',body:JSON.stringify({path:currentPath,name})});notice('Folder created.');loadList()}catch(e){notice(e.message,'error')}
  }
  async function renameItem(path,oldName){
    const name=prompt('Rename to:',oldName); if(!name||name===oldName)return;
    try{await api('rename',{method:'POST',body:JSON.stringify({path,name})});notice('Renamed.');loadList()}catch(e){notice(e.message,'error')}
  }
  async function deleteItem(path,name){
    if(!confirm(`Permanently delete “${name}”?\n\nFolders are deleted with everything inside them.`))return;
    try{await api('delete',{method:'POST',body:JSON.stringify({path})});notice('Deleted.');loadList()}catch(e){notice(e.message,'error')}
  }
  async function downloadFile(path){
    try{const d=await api('download-ticket',{method:'POST',body:JSON.stringify({path})});location.href=d.url}catch(e){notice(e.message,'error')}
  }

  async function start(){
    token=getToken();
    if(!token){loginScreen();return;}
    shell();
    try{session=await api('session');await loadList()}catch(e){if(document.getElementById('files'))notice(e.message,'error')}
  }
  start();
})();
</script>
</body>
</html>
